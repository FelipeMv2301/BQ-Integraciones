[project]
name = "bq-integraciones"
version = "0.1.0"
description = "Pipeline Woo, SAP, folio, Facele/Docele, Brevo, bioquimicacl"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "flower>=2.0",
    "requests>=2.32",
    "xmltodict>=0.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "sentry-sdk[fastapi]>=2.0",
    "rut-chile>=0.7",
    "pytz>=2024.1",
    "unidecode>=1.3",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx",
    "ruff>=0.6",
    "aiosqlite>=0.22",   
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/", "integraciones/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",
    "UP042",  # StrEnum -- SQLModel/Postgres necesita (str, Enum) para el ENUM(native_enum=False)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
